
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="todo-box">
            <h1>My To-Do List</h1>
            <p class="subtitle">Organize your day, achieve your goals.</p>

            <form id="todo-form">
                <input type="text" id="task-input"
                    placeholder="Enter your task..." autocomplete="off">
                <button type="submit">Add Task</button>
            </form>

            <div class="task-info">
                <span id="task-count">0 Tasks</span>
                <button id="clear-all">Clear All</button>
            </div>

            <ul id="task-list"></ul>

            <p id="empty-message">No tasks yet. Add your first task!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
